services:
  - type: web
    name: casewise
    runtime: python
    plan: free                      # sleeps after ~15 min idle; the next visit takes ~30-60s to wake up
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5               # keep in sync with the version used for local development and tests
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false                 # secret: set it in the Render dashboard, never in this file
      - key: TRUST_PROXY_HEADERS
        value: "true"               # Render is a proxy: read the visitor's IP from its headers
      - key: AI_REQUESTS_PER_MINUTE
        value: "5"
      - key: AI_REQUESTS_PER_DAY
        value: "50"
